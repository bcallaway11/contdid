name: Revdep check

on:
  pull_request:
  workflow_dispatch:

jobs:
  revdep_check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::revdepcheck
            any::rcmdcheck
          needs: check

      - name: Reverse dependency check
        run: Rscript -e 'revdepcheck::revdep_check(num_workers = 2)'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: revdep-results
          path: revdep/
