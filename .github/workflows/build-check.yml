name: Build check

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::pkgdown
            any::rmarkdown
          needs: website

      - name: Build README
        run: Rscript -e 'devtools::build_readme()'
        if: hashFiles('README.Rmd') != ''

      - name: Build vignettes
        run: Rscript -e 'devtools::build_vignettes()'
        if: hashFiles('vignettes/**') != ''

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site()'
